<div class="ex-isolation" id="ex2-yellow-options-2026">
    <style>

            font-size: 1.15rem; font-weight: 800; color: #45188c; margin-bottom: 14px; background: #fef08a; display: inline-block; padding: 2px 10px; border-radius: 6px;

        }

        .btn-check:hover { background: #7c3aed; }

        .btn-show:hover { background: #e2e8f0; }

        .btn-reset:hover { background: #ffe4e6; }

    <h2>🟨 Ejercicio 2: Significado de las palabras destacadas</h2>
    <div class="ex-instruction">Instrucción: Elige la opción que explica con precisión el significado del término en el contexto del texto.</div>

    <!-- 1: te punza con -->
    <div class="ex2-card" id="ex2_q1" data-ans="2" data-explain="Correcto: 'Punzar' metafóricamente significa clavar indirectas molestas. La opción 1 se basa en el falso amigo inglés 'punish' (castigar) y la 3 es una broma literal.">
        <div class="ex2-term-title">1. te punza con (comentarios)</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(1, 1, this)">1) Te castiga legalmente o te impone una multa por tus palabras. [Falso amigo: punish]</button>
            <button class="ex2-opt-btn" onclick="selectEx2(1, 2, this)">2) Te molesta o hiere indirectamente con frases satíricas o críticas agudas.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(1, 3, this)">3) Te clava un cactus real en el brazo cada vez que hablas.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb1"></div>
    </div>

    <!-- 2: Mañana mismo -->
    <div class="ex2-card" id="ex2_q2" data-ans="1" data-explain="Correcto: Muestra urgencia inmediata. La opción 2 se basa en la interferencia del inglés 'same' / ruso 'тот же самый', y la 3 es la ironía sobre la procrastinación.">
        <div class="ex2-term-title">2. Mañana mismo</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(2, 1, this)">1) Sin falta y sin postergarlo, justo al día siguiente.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(2, 2, this)">2) El mismo día de hoy pero con la personalidad de mañana. [Interferencia de 'mismo']</button>
            <button class="ex2-opt-btn" onclick="selectEx2(2, 3, this)">3) Expresión española que significa que nunca se va a hacer realmente.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb2"></div>
    </div>

    <!-- 3: compromisos -->
    <div class="ex2-card" id="ex2_q3" data-ans="3" data-explain="Correcto: 'Compromiso' es una obligación o acuerdo. La opción 1 usa la interferencia rusa/inglesa de 'компромисс/compromise' y la 2 es una ironía sobre bodas.">
        <div class="ex2-term-title">3. compromisos</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(3, 1, this)">1) Acuerdos mutuos donde ambas partes ceden para evitar un conflicto. [Falso amigo: компромисс]</button>
            <button class="ex2-opt-btn" onclick="selectEx2(3, 2, this)">2) Anillos de boda caros que obligan a organizar fiestas gigantescas.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(3, 3, this)">3) Obligaciones, tareas pactadas o responsabilidades asumidas.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb3"></div>
    </div>

    <!-- 4: autoexigirte -->
    <div class="ex2-card" id="ex2_q4" data-ans="2" data-explain="Correcto: Demandarse demasiado a uno mismo. La opción 1 confunde con la palabra 'auto' (coche) y la 3 es una broma sobre compras automáticas.">
        <div class="ex2-term-title">4. autoexigirte</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(4, 1, this)">1) Exigir que te compren un automóvil de lujo inmediatamente. [Interferencia de 'auto']</button>
            <button class="ex2-opt-btn" onclick="selectEx2(4, 2, this)">2) Demandarte a ti mismo un rendimiento o perfección muy altos.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(4, 3, this)">3) Activar el piloto automático del cerebro para no pensar en todo el día.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb4"></div>
    </div>

    <!-- 5: No hace falta -->
    <div class="ex2-card" id="ex2_q5" data-ans="1" data-explain="Correcto: Indica que algo no es necesario. La opción 2 usa el falso amigo de 'hacer falta' como cometer una falta/falta de respeto y la 3 es una broma sobre cometer delitos.">
        <div class="ex2-term-title">5. No hace falta</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(5, 1, this)">1) No es necesario / No hay obligación de hacerlo.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(5, 2, this)">2) Nadie está cometiendo una falta o infracción grave. [Falso amigo: falta/infracción]</button>
            <button class="ex2-opt-btn" onclick="selectEx2(5, 3, this)">3) Frase que usan los psicólogos para prohibir strictly hacer algo.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb5"></div>
    </div>

    <!-- 6: una chuleta de examen -->
    <div class="ex2-card" id="ex2_q6" data-ans="3" data-explain="Correcto: 'Chuleta' en España es un papelito con apuntes para copiar (шпоры). La opción 1 usa el significado culinario literal (chuleta de cerdo) y la 2 confunde con la palabra 'chiste'.">
        <div class="ex2-term-title">6. una chuleta de examen</div>
        <div class="ex2-options-list">
            <button class="ex2-opt-btn" onclick="selectEx2(6, 1, this)">1) Un trozo de carne de cerdo frita que se come durante las pruebas. [Falso amigo culinario]</button>
            <button class="ex2-opt-btn" onclick="selectEx2(6, 2, this)">2) Un chiste o broma mala que dice el profesor para relajar el ambiente.</button>
            <button class="ex2-opt-btn" onclick="selectEx2(6, 3, this)">3) Apunte escondido e ilegal con las respuestas para copiar en una prueba.</button>
        </div>
        <div class="ex2-feedback" id="ex2_fb6"></div>
    </div>

    <div class="ex-score-box" id="ex2_score"></div>

    <div class="ex-control-bar">
        <button class="ex-ctrl-btn btn-check" onclick="checkEx2()">✅ Comprobar</button>
        <button class="ex-ctrl-btn btn-show" onclick="showEx2()">👁️ Ver respuestas</button>
        <button class="ex-ctrl-btn btn-reset" onclick="resetEx2()">🔄 Reiniciar</button>
    </div>

    <script>
        const ex2Answers = {};

        function selectEx2(q, opt, btn) {
            ex2Answers[q] = opt;
            const card = document.getElementById('ex2_q' + q);
            card.querySelectorAll('.ex2-opt-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function checkEx2() {
            let correct = 0;
            for(let i = 1; i <= 6; i++) {
                const card = document.getElementById('ex2_q' + i);
                const target = parseInt(card.getAttribute('data-ans'));
                const btns = card.querySelectorAll('.ex2-opt-btn');
                const fb = document.getElementById('ex2_fb' + i);
                
                btns.forEach((b, idx) => {
                    b.classList.remove('correct', 'wrong');
                    if(idx + 1 === target) b.classList.add('correct');
                    if(ex2Answers[i] && ex2Answers[i] === idx + 1 && ex2Answers[i] !== target) {
                        b.classList.add('wrong');
                    }
                });
                if(ex2Answers[i] === target) correct++;
                fb.innerText = card.getAttribute('data-explain');
                fb.style.display = 'block';
            }
            const sb = document.getElementById('ex2_score');
            sb.innerText = `📊 Resultado: ${correct} de 6 correctas`;
            sb.style.display = 'block';
        }

        function showEx2() {
            for(let i = 1; i <= 6; i++) {
                const card = document.getElementById('ex2_q' + i);
                const target = parseInt(card.getAttribute('data-ans'));
                const btns = card.querySelectorAll('.ex2-opt-btn');
                
                btns.forEach((b, idx) => {
                    b.classList.remove('selected', 'wrong');
                    if(idx + 1 === target) {
                        b.classList.add('correct');
                    }
                });
                
                const fb = document.getElementById('ex2_fb' + i);
                fb.innerText = card.getAttribute('data-explain');
                fb.style.display = 'block';
            }
            const sb = document.getElementById('ex2_score');
            sb.innerText = '🔑 Respuestas correctas mostradas.';
            sb.style.display = 'block';
        }

        function resetEx2() {
            for(let key in ex2Answers) delete ex2Answers[key];
            for(let i = 1; i <= 6; i++) {
                const card = document.getElementById('ex2_q' + i);
                card.querySelectorAll('.ex2-opt-btn').forEach(b => b.className = 'ex2-opt-btn');
                document.getElementById('ex2_fb' + i).style.display = 'none';
            }
            document.getElementById('ex2_score').style.display = 'none';
        }
    </script>
</div>
